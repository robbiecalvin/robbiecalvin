name: Assemble approved free plugin download
on:
  push:
    paths:
      - 'release-input/quick-seo/**'
      - '.github/workflows/assemble-free-download.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assemble-free-download
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'robbiecalvin/robbiecalvin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify approved package
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          parts=sorted(Path('release-input/quick-seo').glob('part-*.b64'))
          assert len(parts)==15, 'Missing transfer parts'
          data=b''.join(base64.b64decode(p.read_text(),validate=True) for p in parts)
          assert hashlib.sha256(data).hexdigest()=='2e207a98953a173b9a495f576b3a7794ca35d26809fce2246547e84412a58336'
          z=zipfile.ZipFile(io.BytesIO(data))
          assert z.testzip() is None
          assert all(n.startswith('quick-seo/') and '..' not in Path(n).parts for n in z.namelist())
          out=Path('downloads/wordpress/quick-seo.zip');out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(data)
          print('Verified original Quick SEO package:',len(data),'bytes')
          PY
      - name: Commit validated binary to the public website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/wordpress/quick-seo.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Assemble approved free Quick SEO download'
          git push origin HEAD:main
